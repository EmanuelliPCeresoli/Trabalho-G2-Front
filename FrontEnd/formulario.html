
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ponto Geográfico</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <span class="logo">Pontos Geográficos</span>
    <nav>
      <a href="index.html">Pontos</a>
      <a href="formulario.html" id="link-novo">Novo ponto</a>
    </nav>
  </header>

  <main class="container">
    <p class="info escondido" id="carregando">Carregando ponto...</p>

    <section class="escondido" id="secao-form">
      <h1 id="titulo">Novo ponto</h1>

      <p class="erro escondido" id="erro"></p>

      <form class="formulario" id="form-ponto">
        <label>
          Nome *
          <input name="name" maxlength="100" required />
        </label>

        <label>
          Descrição
          <textarea name="description" rows="3" maxlength="255"></textarea>
        </label>

        <div class="linha">
          <label>
            Latitude *
            <input name="latitude" type="number"
                   step="any" min="-90" max="90" required />
          </label>

          <label>
            Longitude *
            <input name="longitude" type="number"
                   step="any" min="-180" max="180" required />
          </label>
        </div>

        <div class="acoes">
          <button type="submit" id="btn-salvar">Cadastrar</button>
          <a href="index.html" class="botao secundario">Cancelar</a>
        </div>
      </form>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/formulario.js"></script>
</body>
</html>
