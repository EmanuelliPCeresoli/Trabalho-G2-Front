
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pontos Geográficos</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <span class="logo">Pontos Geográficos</span>
    <nav>
      <a href="index.html" class="active">Pontos</a>
      <a href="formulario.html">Novo ponto</a>
    </nav>
  </header>

  <main class="container">
    <section>
      <div class="topo">
        <h1>Pontos Geográficos</h1>
        <a href="formulario.html" class="botao">+ Novo ponto</a>
      </div>

      <form class="busca" id="form-busca">
        <input id="campo-busca" placeholder="Buscar por nome..." />
        <button type="submit" class="secundario">Buscar</button>
      </form>

      <p class="info" id="carregando">Carregando...</p>
      <p class="erro escondido" id="erro"></p>
      <p class="info escondido" id="vazio">Nenhum ponto encontrado.</p>

      <div class="tabela-container">
  <table class="escondido" id="tabela">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Descrição</th>
        <th>Latitude</th>
        <th>Longitude</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="corpo-tabela"></tbody>
  </table>
</div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/lista.js"></script>
</body>
</html>
